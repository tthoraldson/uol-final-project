services:
  frontend:
    build:
      context: ./frontend/
    networks:
      - frontend-network
    ports:
      - "3005:3005"

  api:
    build:
      context: ./backend/api/
    networks:
      - model-network
      - frontend-network
    ports:
      - "8070:8070"

  text-to-music:
    build:
      context: ./backend/text-to-music
    networks:
      - model-network
    ports:
      - "8080:8080"
    env_file:
      - .env

  basic-pitch:
    build:
      context: ./backend/basic-pitch
    networks:
      - model-network
    ports:
      - "8090:8090"
    env_file:
      - .env

  crepe:
    build:
      context: ./backend/crepe
    networks:
      - model-network
    ports:
      - "8060:8060"
    env_file:
      - .env

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    ports:
      - "5050:5050"
    networks:
      - model-network
    volumes:
      - mlflow_data:/mlflow
    # Command to start the server inside the container, pointing to local storage
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 5050 
      --backend-store-uri sqlite:////mlflow/mlflow.db 
      --default-artifact-root /mlflow/artifacts
    env_file:
      - .env

networks:
  frontend-network:
    driver: bridge

  model-network:
    driver: bridge

volumes:
  mlflow_data:
